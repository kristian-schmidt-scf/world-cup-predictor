<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="c"><circle cx="16" cy="16" r="15.5"/></clipPath>
    <radialGradient id="bg" cx="42%" cy="36%" r="65%">
      <stop offset="0%"   stop-color="#1e2d40"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </radialGradient>
  </defs>

  <!-- Ball body -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>

  <!-- Soccer ball seam lines — 3 arcs forming the classic panel pattern -->
  <g clip-path="url(#c)" fill="none" stroke="#c8a84b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal arc (upper-left → upper-right, dips toward center) -->
    <path d="M 2,12 Q 16,20 30,12" stroke-width="2.4"/>
    <!-- Left diagonal (upper-left junction → lower-left) -->
    <path d="M 2,12 Q 8,24 10,31" stroke-width="2.4"/>
    <!-- Right diagonal (upper-right junction → lower-right) -->
    <path d="M 30,12 Q 24,24 22,31" stroke-width="2.4"/>
  </g>

  <!-- Gold ring -->
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#c8a84b" stroke-width="1.6"/>
</svg>
